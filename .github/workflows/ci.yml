# CI gate for reconcile-ai (single Spring Boot module).
# Runs unit tests (surefire) and Testcontainers integration tests (failsafe, Postgres + pgvector).
# No OPENAI_API_KEY: the automated suite uses FakeEmbeddingModel and the mock-llm profile.
# The openai and ollama tagged tests are excluded by the pom default and never run here.
name: ci

on:
  push:
    branches: [main, integrate-phase2]
    paths-ignore: ['**.md', 'docs/**']   # docs-only changes do not spend Actions minutes
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  # Nightly schedule paused: the repo is private and Actions minutes are capped. Run on demand from the
  # Actions tab (workflow_dispatch) for a dependency/base-image drift check.
  # schedule:
  #   - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mvn clean verify
    runs-on: ubuntu-latest        # Docker is preinstalled, so Testcontainers works without setup
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Test summary
        if: always()
        run: |
          {
            echo "### Test results"
            for f in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
              [ -f "$f" ] && echo "- $(basename "$f" .txt): $(grep -m1 'Tests run' "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14

      # The mock eval runs inside `mvn verify`; keep its reports so a regression can be read, not just seen as red.
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: target/eval/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate bill of materials
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DoutputFormat=json -DoutputName=bom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.json
          retention-days: 30

  k8s:
    name: k8s manifests + container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Render (kustomize) and validate (kubeconform, strict)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # The CRD catalog supplies the KEDA ScaledObject schema; built-in kinds still use the default schemas.
          for overlay in k8s/base k8s/overlays/kind k8s/overlays/keda; do
            kubectl kustomize "$overlay" | ./kubeconform -strict -summary -kubernetes-version 1.31.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
          done

      - name: Build container image
        run: docker build -t reconcile-ai:ci .

      # Gate: fails the job on any HIGH or CRITICAL finding. ignore-unfixed is on so only actionable findings gate
      # (a vulnerability with no released fix cannot be remediated by a rebuild or a version bump).
      # limit-severities-for-sarif makes the SARIF report, and therefore the gate, use the same severity filter.
      # To accept a specific finding, see "Accepting a Trivy finding" in the README (justification and expiry).
      - name: Scan image for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: reconcile-ai:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: '1'
          trivyignores: .trivyignore

      # Upload the report even when the scan failed, so the findings can be read.
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30

  alerts:
    name: alert rules + alertmanager config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: promtool check and unit-test the alert rules
        run: |
          docker run --rm -v "$PWD/docker/observability:/w" -w /w --entrypoint promtool prom/prometheus:v2.55.1 check rules alerts.yml
          docker run --rm -v "$PWD/docker/observability:/w" -w /w --entrypoint promtool prom/prometheus:v2.55.1 test rules alerts.test.yml
      - name: amtool check the routing and template
        run: docker run --rm -v "$PWD/docker/observability:/etc/alertmanager" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml

  terraform:
    name: terraform fmt, validate, test, tflint, checkov
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0
          terraform_wrapper: false

      # No AWS account, credentials or network access to AWS: tests use a mock provider.
      - run: terraform fmt -check -recursive

      - name: Validate every module and environment, test the modules and the demo
        run: |
          for d in modules/* envs/demo envs/localstack; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            # envs/localstack has no .tftest.hcl files; its real proof is the terraform-localstack job.
            if [ "$d" != "envs/localstack" ]; then
              terraform -chdir="$d" test
            fi
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.1
      - name: tflint (AWS ruleset)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          for d in modules/* envs/demo envs/localstack; do
            echo "::group::$d"
            tflint --chdir="$d" --config="$PWD/.tflint.hcl"
            echo "::endgroup::"
          done

      - name: checkov (security policy checks)
        run: docker run --rm -v "$PWD:/data" -w /data bridgecrew/checkov:3.2.450 -d . --framework terraform --quiet --compact

  terraform-localstack:
    name: terraform apply + destroy against LocalStack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real apply of the network, secrets, storage and ci modules against an AWS emulator (free, test account
    # 000000000000). ECS, RDS, the load balancer and Budgets are paid-tier emulations and stay with the mock tests.
    services:
      localstack:
        image: localstack/localstack:4.9
        ports: ["4566:4566"]
        env:
          SERVICES: ec2,s3,kms,secretsmanager,iam,sts,logs
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: infra/terraform/envs/localstack
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0
          terraform_wrapper: false
      - run: terraform init -input=false
      - name: Apply
        run: terraform apply -auto-approve -input=false -no-color
      - name: No drift straight after apply
        run: terraform plan -detailed-exitcode -input=false -no-color
      - name: Object Lock refuses a delete
        # Uses the AWS CLI v2 preinstalled on the runner, pointed at LocalStack. No pip packages: awscli-local
        # pulls in an old botocore that imports botocore.vendored, which current botocore no longer ships.
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-south-1
          AWS_PAGER: ""
          LOCALSTACK_URL: http://localhost:4566
        run: |
          aws() { command aws --endpoint-url "$LOCALSTACK_URL" "$@"; }
          B=$(terraform output -raw anchor_bucket)
          echo anchor > anchor.txt
          V=$(aws s3api put-object --bucket "$B" --key anchors/ci --body anchor.txt \
            --object-lock-mode GOVERNANCE \
            --object-lock-retain-until-date "$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)" \
            --query VersionId --output text)
          if aws s3api delete-object --bucket "$B" --key anchors/ci --version-id "$V"; then
            echo "::error::a locked anchor could be deleted"; exit 1
          fi
      - name: Destroy
        if: always()
        run: terraform destroy -auto-approve -input=false -no-color

  ui:
    name: ui build + test (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false --browsers=ChromeHeadless
