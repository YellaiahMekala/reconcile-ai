# CI gate for reconcile-ai (single Spring Boot module).
# Runs unit tests (surefire) and Testcontainers integration tests (failsafe, Postgres + pgvector).
# No OPENAI_API_KEY: the automated suite uses FakeEmbeddingModel and the mock-llm profile.
# The openai and ollama tagged tests are excluded by the pom default and never run here.
name: ci

on:
  push:
    branches: [main, integrate-phase2]
  pull_request:
  schedule:
    - cron: '0 3 * * *'           # nightly: catches dependency and base-image drift without a push
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mvn clean verify
    runs-on: ubuntu-latest        # Docker is preinstalled, so Testcontainers works without setup
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Test summary
        if: always()
        run: |
          {
            echo "### Test results"
            for f in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
              [ -f "$f" ] && echo "- $(basename "$f" .txt): $(grep -m1 'Tests run' "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14

  ui:
    name: ui build + test (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false --browsers=ChromeHeadless
