global:
  scrape_interval: 10s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: reconcile-ai
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]   # the app runs on the host (mvn spring-boot:run)
