groups:
  - name: reconcile-audit-anchor
    rules:
      # A failed anchor is swallowed per tenant (one tenant's storage error must not stop the others), so without this
      # alert it is only a log line. Anchoring retries every cycle; alert when errors persist.
      - alert: AuditAnchorWriteFailing
        expr: increase(reconcile_audit_anchor_total{result="error"}[30m]) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Audit anchor writes are failing"
          description: "Anchoring errors persisted for 15m; the audit chain exposure window is growing. Check the 'audit anchor failed for tenant' log line and S3/MinIO health."
      # The security signal: the live chain no longer matches an immutable anchor (history rewritten or deleted).
      - alert: AuditAnchorMismatch
        expr: increase(reconcile_audit_anchor_verify_total{result="mismatch"}[15m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Audit chain does not match its immutable anchor"
          description: "Treat as possible tampering until proven otherwise."

  - name: reconcile-llm
    rules:
      # The breaker stays open only while the provider keeps failing; investigations then fail fast with LLM_CIRCUIT_OPEN.
      - alert: LlmCircuitOpen
        expr: max(resilience4j_circuitbreaker_state{name="investigation-llm", state="open"}) == 1
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "LLM circuit breaker is open"
          description: "Model calls are failing fast. Check the provider status, the API key and quota."
      - alert: LlmErrorRateHigh
        expr: |
          sum(increase(reconcile_llm_errors_total[10m]))
            / clamp_min(sum(increase(reconcile_llm_latency_seconds_count[10m])), 1) > 0.2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "More than 20% of model calls failed in the last 10 minutes"
          description: "Retries are absorbing it for now, but the breaker opens next if this continues."
      # Prometheus cannot read the app's env. Keep this threshold in step with the budget you set for the app.
      - alert: LlmSpendBurnHigh
        expr: sum(increase(reconcile_llm_cost_usd_total[1h])) > 5
        labels: {severity: warning}
        annotations:
          summary: "Estimated model spend above 5 USD in the last hour"
          description: "Estimated from list prices and provider-reported tokens, not invoiced. Look for a retry loop or an agent running long."
      - alert: PiiNerUnavailable
        expr: increase(reconcile_pii_ner_unavailable_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "PII entity recognition sidecar is unreachable"
          description: "Person and location names are not being masked (identifier masking still works). If fail-closed is on, model calls are being refused."

  - name: reconcile-workflow
    rules:
      - alert: InvestigationFailuresHigh
        expr: sum(increase(reconcile_investigation_failed_total[15m])) > 3
        labels: {severity: warning}
        annotations:
          summary: "Several investigations failed in the last 15 minutes"
          description: "Group by the reason label: LLM_CIRCUIT_OPEN, CAPACITY_EXCEEDED, INTERRUPTED, MODEL_OUTPUT_NOT_VALID_JSON."
      # Rows are retried in order, so a publish failure holds the whole key behind it (Kafka on only).
      - alert: OutboxBacklogGrowing
        expr: increase(reconcile_outbox_failures_total[15m]) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Outbox publish failures are persisting"
          description: "Events are queued in Postgres, not lost, but downstream consumers are falling behind. Check the Kafka broker."
      - alert: AgentToolDenials
        expr: sum(increase(reconcile_agent_tool_calls_total{outcome="DENIED"}[15m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "The investigation agent had tool calls denied"
          description: "A caller without the required role reached the agent, or a tool was invoked outside its guard. Review agent_tool_call for the job."
