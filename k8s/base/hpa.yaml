# Autoscaling on CPU (requests.cpu = 250m). Scale-up is quick, scale-down is slow so SSE clients are not churned.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reconcile-ai
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: reconcile-ai }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Pods, value: 2, periodSeconds: 30 }]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
