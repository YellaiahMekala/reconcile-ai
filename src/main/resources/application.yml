# ---------------------------------------------------------------------------
# reconcile-ai base configuration (Phase 1: Tier 0 + Tier 1)
# Every secret/host is an env var with a local-dev default so `mvn spring-boot:run`
# works against docker/docker-compose.yml with zero setup.
# ---------------------------------------------------------------------------
spring:
  application:
    name: reconcile-ai
  profiles:
    # Chat model selection: mock-llm (default, zero tokens, deterministic) | ollama (local) | openai (real, needs OPENAI_API_KEY).
    default: mock-llm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reconcile}
    # Application login: NOT the table owner and NOT a superuser, so Postgres Row-Level Security applies (V6).
    username: ${DB_APP_USER:reconcile_app}
    password: ${DB_APP_PASSWORD:reconcile_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations run as the schema OWNER (separate credentials); the app role only gets DML grants.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reconcile}
    user: ${DB_USER:reconcile}
    password: ${DB_PASSWORD:reconcile}
    placeholders:
      app_user: ${DB_APP_USER:reconcile_app}
      app_password: ${DB_APP_PASSWORD:reconcile_app}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  threads:
    # Java 21 virtual threads for request handling, @Scheduled and the default task executor (ADR-virtual-threads).
    # Request work is I/O-bound (Postgres, model provider, EKA); a platform thread per request idles on those calls.
    # The investigation executor stays a bounded platform pool on purpose: its full queue is the 503 back-pressure.
    # Tenant identity is per-thread (SecurityContextHolder, TenantScope) and never inherited: VirtualThreadsTenantIsolationIT.
    virtual:
      enabled: true
  # -------------------------------------------------------------------------
  # Spring AI (Phase 2)
  # -------------------------------------------------------------------------
  ai:
    retry:
      # Spring AI's own RetryTemplate defaults to 10 attempts. Chat retries are owned by LlmResilience
      # (reconcile.ai.resilience.*), so the built-in layer is reduced to avoid 3 x 10 nested paid attempts.
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        max-interval: 2s
    model:
      # Exactly ONE provider per model type. This is how two AI starters coexist on the classpath
      # without an ambiguous ChatModel/EmbeddingModel bean.
      embedding: openai          # LOCKED: embeddings are always OpenAI text-embedding-3-small
      chat: none                 # chat model comes from a profile: mock-llm (default), ollama or openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}   # required at startup outside the test profile (fail fast)
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        # Flyway owns vector_store since V6 (Row-Level Security needs the table owned by a role other than the app).
        # The DDL in V6 matches Spring AI 1.1.8's own (UUID id, json metadata, HNSW cosine, 1536 dims).
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536            # must equal the embedding model's output size
        max-document-batch-size: 1000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms                # a slow cache must not slow investigations; lookups fail open
  security:
    oauth2:
      resourceserver:
        jwt:
          # Local dev/test validate JWTs against a public key on the classpath.
          # scripts/generate-local-jwt.ps1 mints tokens with the matching private key.
          public-key-location: ${JWT_PUBLIC_KEY:classpath:jwt/dev-public.pem}

# ---------------------------------------------------------------------------
# Application tuning knobs (bound to @ConfigurationProperties classes)
# ---------------------------------------------------------------------------
reconcile:
  agent:                            # investigation agent (Phase 4B): the model picks read-only tools; off by default
    enabled: ${AGENT_ENABLED:false}
    max-tool-calls: 6
    max-model-turns: 8              # each tool round trip is one turn
    timeout-seconds: 60
    max-tool-result-chars: 4000
    supervised:                     # specialist agents (Phase 4G); also needs agent.enabled; off by default
      enabled: ${SUPERVISED_ENABLED:false}
      # Sized from the live run of 2026-11-13: on gpt-4o-mini the analyst alone uses 6-8 turns (the same as agent
      # mode), so the first budget (8 calls, 14 turns) failed 4 of 12 hard cases and 18 of 28 planned cases with
      # AGENT_TURN_LIMIT. Still one budget shared by every specialist, not one per agent.
      max-tool-calls: 12            # shared by ALL specialists in one run, not per agent
      max-model-turns: 24           # analyst (up to 9) + risk checker (2) + reviewer (1) + supervisor hand-offs
      timeout-seconds: 180
      max-delegations: 6            # planned variant: hand-offs the supervisor model may make
  ratelimit:                        # per tenant, on POST /investigations (each one can start paid model calls)
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: 20                    # burst size
    refill-per-minute: 20           # sustained rate
    # memory: one bucket per JVM (N replicas = up to N x the rate). redis: one bucket per tenant shared by all
    # replicas (spring.data.redis.*); falls back to the local bucket while Redis is down.
    store: ${RATE_LIMIT_STORE:memory}
  security:
    # Empty: tokens are verified with the local dev public key above (demo personas, tests).
    # Set to a real IdP issuer to switch to JWKS + issuer + audience validation, e.g. Keycloak:
    #   OIDC_ISSUER_URI=http://localhost:8180/realms/reconcile   (compose profile "keycloak")
    issuer-uri: ${OIDC_ISSUER_URI:}
    audience: ${OIDC_AUDIENCE:reconcile-api}
  ingestion:
    chunk-size-tokens: 400          # ~300 words: big enough for a statement line + context, small enough to cite precisely
    min-chunk-size-chars: 200
    min-chunk-length-to-embed: 10   # skip whitespace/garbage fragments -> no wasted embedding tokens
    max-chunks-per-evidence: 200    # hard cap: a 10 MB junk upload cannot burn thousands of embedding calls
  retrieval:
    vector-top-k: 8
    keyword-top-k: 8
    similarity-threshold: 0.25      # score floor; tune with an out-of-corpus query (see README "Retrieval tuning")
    rrf-k: 60                       # standard Reciprocal Rank Fusion constant
    max-results: 8

  investigation:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 50              # beyond this, POST /investigations returns 503 instead of queueing unboundedly
    lease-seconds: 300              # a RUNNING job with no heartbeat for this long is treated as orphaned
    sweep-interval-ms: 60000
    max-context-tokens: 3000        # evidence budget per prompt (TOKEN OPTIMIZATION)
    max-output-tokens: 700          # model output cap (TOKEN OPTIMIZATION)
    max-analyst-note-chars: 1000
  gateway:                          # platform Q2.1: route the investigation model call through ai-gateway; off by default
    enabled: ${GATEWAY_ENABLED:false}
    base-url: ${GATEWAY_BASE_URL:http://localhost:8080}
    token-uri: ${GATEWAY_TOKEN_URI:http://localhost:8180/realms/ai-gateway/protocol/openid-connect/token}
    client-id: ${GATEWAY_CLIENT_ID:reconcile-ai}
    client-secret: ${GATEWAY_CLIENT_SECRET:}
    token-scope: ${GATEWAY_TOKEN_SCOPE:aud-ai-gateway}   # the platform realm adds aud=ai-gateway only for this scope
    connect-timeout: 3s
    request-timeout: 60s            # per attempt; a timeout after sending is an unknown outcome and is never retried
    # Per-tenant OAuth clients (empty = every tenant uses the shared client-id above, billed to its tenant).
    # When set, each job uses its tenant's client, the token's tenant_id claim must equal the job's tenant, and a
    # tenant with no entry fails before sending (GATEWAY_TENANT_CREDENTIALS_MISSING). Bracket keys keep the exact id;
    # client-secret-env names the environment variable holding the secret (never the secret itself).
    # tenants:
    #   "[TENANT_A]": { client-id: reconcile-ai-tenant-a, client-secret-env: GATEWAY_SECRET_TENANT_A }
    #   "[TENANT_B]": { client-id: reconcile-ai-tenant-b, client-secret-env: GATEWAY_SECRET_TENANT_B }
  knowledge:                        # platform Q1: EKA procedure knowledge as a pre-step of the single-call mode; off by default
    enabled: ${KNOWLEDGE_ENABLED:false}
    base-url: ${EKA_BASE_URL:http://localhost:8080}          # EKA edge; only POST /api/v1/search is called
    token-uri: ${KNOWLEDGE_TOKEN_URI:http://localhost:8190/realms/platform/protocol/openid-connect/token}
    token-scope: ${KNOWLEDGE_TOKEN_SCOPE:aud-eka-api}        # the platform realm adds aud=eka-api only for this scope
    connect-timeout: 2s
    request-timeout: 5s             # advisory context: a slow EKA must not hold the investigation
    top-k: 3
    max-snippet-chars: 800
    max-total-chars: 2400           # all procedure text in one prompt; separate from the evidence token budget
    fail-closed: ${KNOWLEDGE_FAIL_CLOSED:false}   # false: continue and record UNAVAILABLE; true: fail the job retryably
    breaker-failure-rate: 50
    breaker-window: 10
    breaker-open-for: 30s
    # One platform-realm client per tenant is required (EKA isolates by caller identity, spike S-2); no shared client.
    # The token's tenant_id claim must equal the tenant id exactly. client-secret-env names the variable, never the secret.
    # tenants:
    #   "[tenant-a]": { client-id: svc-reconcile-tenant-a, client-secret-env: KC_SVC_TENANT_A_SECRET }
    #   "[tenant-b]": { client-id: svc-reconcile-tenant-b, client-secret-env: KC_SVC_TENANT_B_SECRET }
  rero:                             # platform Q3: RERO investigation mode (Contract C); off by default, refused with 409
    enabled: ${RERO_ENABLED:false}
    base-url: ${RERO_BASE_URL:http://localhost:8095}
    token-uri: ${RERO_TOKEN_URI:http://localhost:8190/realms/platform/protocol/openid-connect/token}
    token-scope: ${RERO_TOKEN_SCOPE:aud-rero-api aud-ai-gateway}   # must yield aud rero-api AND ai-gateway (TDD 2.2)
    required-audiences: rero-api,ai-gateway
    model-via-gateway: ${RERO_MODEL_VIA_GATEWAY:false}  # true only if RERO runs GatewayModel; needed while gateway route is on
    connect-timeout: 2s
    request-timeout: 5s
    poll-interval: 500ms
    deadline-seconds: 60            # contract 5..120; run token TTL = deadline + 30 s
    deadline-grace: 5s
    max-tool-calls: 8               # contract 1..20; counted atomically per job in investigation_job.tool_calls_used
    max-evidence-chars: 1500
    run-token:                      # ES256 P-256 key pair, PEM from the environment / secret manager; never committed
      kid: ${RERO_RUN_TOKEN_KID:rero-run-1}
      private-key-pem: ${RERO_RUN_TOKEN_PRIVATE_KEY_PEM:}
      public-key-pem: ${RERO_RUN_TOKEN_PUBLIC_KEY_PEM:}
    # One platform-realm client per tenant, exact tenant_id match, like knowledge. client-secret-env names the variable.
    # tenants:
    #   "[tenant-a]": { client-id: svc-reconcile-rero-tenant-a, client-secret-env: KC_SVC_RERO_TENANT_A_SECRET }
  ai:
    log-prompts: false              # true ONLY on localhost: enables SimpleLoggerAdvisor (logs full prompts)
    pricing:                        # list price per 1M tokens for the cost metric (ESTIMATED). Defaults: gpt-4o-mini
      prompt-usd-per-million: ${LLM_PROMPT_USD_PER_MILLION:0.15}
      completion-usd-per-million: ${LLM_COMPLETION_USD_PER_MILLION:0.60}
    cache:                          # semantic cache of verified drafts (Redis). See RedisSemanticCache.
      enabled: ${CACHE_ENABLED:false}
      similarity-threshold: 0.95    # cosine; config below 0.80 is refused at startup
      ttl-hours: 24
      max-entries-per-tenant: 500
      namespace: v1                 # bump to invalidate everything after a prompt or model change
    pii-masking:
      enabled: true                 # mask account numbers, IBANs, cards, emails, phones before the model call
      ner:                          # optional Presidio sidecar: also mask person names and locations
        enabled: ${PII_NER_ENABLED:false}
        url: ${PII_NER_URL:http://localhost:5002}
        entities: PERSON,LOCATION
        score-threshold: 0.5
        timeout-ms: 3000
        fail-closed: ${PII_NER_FAIL_CLOSED:false}   # true: refuse the model call when Presidio is down
    resilience:
      max-attempts: 3               # 1 call + 2 retries, transient failures only (5xx, 429, timeouts, network)
      initial-backoff-ms: 500       # 500 ms, then 1 s (exponential x2)
      failure-rate-threshold: 50    # % of failures in the window that opens the breaker
      sliding-window-size: 10
      minimum-number-of-calls: 5
      open-state-wait-ms: 30000     # OPEN for 30 s, then HALF_OPEN probes
      permitted-calls-in-half-open: 2
  policy:
    l1-min-confidence: 0.80         # LOCKED: below this, no approval route -> MANUAL_REVIEW
    l2-variance-threshold: 25000    # LOCKED: variance >= this (USD) -> L2 approver
    policy-currency: USD
    auto-resolve:
      enabled: false                # LOCKED: OFF. Implemented path, disabled by default (ADR-9)
      max-variance: 1000            # LOCKED cap; startup fails if configured higher
      min-confidence: 0.95
  kafka:
    enabled: ${KAFKA_ENABLED:false}   # off: no producer, consumer or relay is created; REST path is unaffected
    events-topic: reconcile.break.events
    intake-topic: reconcile.break.intake
    relay-batch-size: 50
    relay-interval-ms: 1000
  digest:
    enabled: ${DIGEST_ENABLED:true}   # one SQL-built digest per tenant per UTC day (advisory-locked: one instance runs it)
    cron: "0 15 0 * * *"              # 00:15 UTC, summarising the previous UTC day
  audit:
    anchor:                           # signed audit-chain heads in WORM storage (S3 Object Lock / MinIO); off by default
      enabled: ${AUDIT_ANCHOR_ENABLED:false}
      cron: "0 */15 * * * *"          # exposure window = interval; advisory-locked so one instance anchors
      key-id: ${AUDIT_ANCHOR_KEY_ID:anchor-key-1}
      public-key: ${AUDIT_ANCHOR_PUBLIC_KEY:}     # Ed25519, base64 X.509 (verification)
      private-key: ${AUDIT_ANCHOR_PRIVATE_KEY:}   # Ed25519, base64 PKCS#8 (signing) - from a secret manager
      lock-mode: ${AUDIT_ANCHOR_LOCK_MODE:COMPLIANCE}   # COMPLIANCE: nobody can delete before retain-until
      retention-days: ${AUDIT_ANCHOR_RETENTION_DAYS:365}
      s3:
        endpoint: ${AUDIT_ANCHOR_S3_ENDPOINT:}    # blank = AWS S3; http://localhost:9000 for MinIO (compose profile "anchor")
        region: ${AUDIT_ANCHOR_S3_REGION:us-east-1}
        bucket: ${AUDIT_ANCHOR_S3_BUCKET:reconcile-audit-anchors}
        access-key: ${AUDIT_ANCHOR_S3_ACCESS_KEY:}   # blank = AWS default credentials chain (IAM role / IRSA)
        secret-key: ${AUDIT_ANCHOR_S3_SECRET_KEY:}
        path-style: ${AUDIT_ANCHOR_S3_PATH_STYLE:false}   # true for MinIO
        create-bucket: ${AUDIT_ANCHOR_S3_CREATE_BUCKET:false}   # dev only; production buckets are provisioned
  streaming:
    emitter-timeout-ms: 120000      # each SSE stream expires; client reconnects (fresh snapshot) or polls
    max-subscribers: 500            # total open streams per instance (each holds an async servlet context)
    max-subscribers-per-job: 20
    heartbeat-interval-ms: 15000    # comment frame keeps proxies from killing idle streams
    fanout: ${SSE_FANOUT:local}     # redis: cross-instance delivery via Redis pub/sub (any node can serve a stream)

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus   # both permitted in SecurityConfig; nothing else is exposed
  health:
    redis:
      enabled: ${CACHE_ENABLED:false}   # Redis is optional: only part of health when the cache is on
  endpoint:
    health:
      show-details: never        # no DB/disk details to unauthenticated callers
  metrics:
    tags:
      application: reconcile-ai
    distribution:
      percentiles-histogram:
        http.server.requests: true
        reconcile.llm.latency: true
  # OpenTelemetry tracing (Micrometer Tracing -> OTel bridge -> OTLP/HTTP). Off by default so a laptop without a
  # collector does not log export errors. Turn on with TRACING_ENABLED=true and the observability compose profile
  # (Jaeger UI on http://localhost:16686).
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    annotations:
      enabled: true

server:
  port: 8080
  error:
    include-message: never       # never leak exception messages through Boot's default /error body

logging:
  level:
    org.springframework.security: INFO
    com.reconcileai: DEBUG

# API docs / Swagger UI: OFF unless SWAGGER_ENABLED=true. Never enable on an internet-facing deployment.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
